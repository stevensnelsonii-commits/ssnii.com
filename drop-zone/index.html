<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Zone — Down for Patching</title>
<style>
  :root {
    --bone: #E8DCC0;
    --ink: #130D08;
    --brick: #711B19;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bone);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  main { padding: 2rem 1.5rem; max-width: 34rem; }
  .rule {
    width: 4.5rem;
    height: 0.3rem;
    background: var(--brick);
    margin: 0 auto 1.5rem auto;
  }
  h1 {
    margin: 0 0 1rem 0;
    font-size: 2.6rem;
    letter-spacing: 0.14em;
    font-weight: 700;
  }
  p { margin: 0; font-size: 1.15rem; line-height: 1.55; }
  .studio {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brick);
  }
</style>
</head>
<body>
<main>
  <div class="rule"></div>
  <h1>DROP ZONE</h1>
  <p>The build is down for patching. It comes back when it's playable.</p>
  <div class="studio">Swamp Shell Industries</div>
</main>
</body>
</html>
